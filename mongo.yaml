version: '3'
services:
  my-app:
    image: my-node-app:v1  # <--- မင်း build ထားတဲ့ image နာမည်
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      
  mongodb:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb # 💡 Container နာမည်နဲ့ လှမ်းခေါ်ထားတာ